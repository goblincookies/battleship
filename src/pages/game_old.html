<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style.css">
    <title>Document</title>
</head>
<body class="max-height">
    <div class="fixed behind rad-grad tall wide "></div>

    <div class="center flex-v-start ideal-size-wide debugA" id="content">

        <div class="flex-v-center marg-top min-height debugB">
            <div class="title debugC">
                <img class="logo-sm shadow" src="../assets/images/logo-plain.png" alt="">
            </div>
            <div class="button-tray flex-h-center center debugA">
                <div class="saftybox flex-h-center wide grow">
                    <button class="pill pad-sides" id="quick-game"> <p class="glow-pink">Back </p></button>
                </div>
                <div class="saftybox flex-h-center wide grow">
                    <p>Won: 0 Lost: 0</p>
                    <input type="checkbox" name="hints" id="">
                    <label for="hints"> use hints</label>
                    <!-- <p class="basic">Place your ships<br>tap to rotate</p> -->
                </div>
            </div>
        </div>

        <div class="stacker-tray center debugF">

            <div class="comp-size flex-v-center centerpiece debugA">
                <div class="box glow three-dee">
                    <ul class="relative drop">
                        <li class="faux-drop" id="faux-drop"></li>
                    </ul>

                    <div class="graph-paper wide tall play-box"></div>
                </div>
            </div>

            <div class="tray-width tray-height flex-v-center debugA">
                <div class="wide tall grow flex-v-center debugB">
                    <div class="wide tall status-tray debugA">
                        <div class="block sunk" id="status-5"></div>
                        <div class="block" id="status-2"></div>
                        <div class="block sunk" id="status-3a"></div>
                        <div class="block" id="status-4"></div>
                        <div class="block" id="status-3b"></div>
                    </div>
                </div>
            </div>

            <div class="play-size flex-v-center centerpiece debugA">
                <div class="box glow drop relative">
                    <ul class="relative drop">
                        <li class="faux-drop hidden" id="faux-drop"></li>
                    </ul>
                    <div class="graph-paper wide tall play-box"></div>
                </div>
            </div>

        </div>
    </div>
    

</body>
</html>
